<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15121f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planador">
<title>Planador</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap">
<style>


:root{
  color-scheme:dark;
  --ink:#0b0a14; --page:#0e0c18; --veil:rgba(11,10,20,.6); --line:rgba(255,236,214,.26);
  --fg:#fff3e4; --muted:#d3c2c4; --ember:#ffb46a;
  --font:"Josefin Sans","Century Gothic","Trebuchet MS",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
*,*::before,*::after{box-sizing:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#app{display:flex;flex-direction:column;gap:8px;align-items:center}
.rotate{display:none}

@media (pointer:coarse){
  body{padding:0}
  .stage{height:100vh;height:100dvh;border-radius:0}
  .hud{left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px))}
  #btnPause{left:max(10px,env(safe-area-inset-left,0px))}
  .corner{right:max(8px,env(safe-area-inset-right,0px))}
}
@media (pointer:coarse) and (orientation:portrait){
  .rotate{display:flex;position:fixed;inset:0;z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--ink);color:var(--fg);font-size:14px;letter-spacing:.2em;text-transform:uppercase}
  .rotate svg{width:64px;height:64px;animation:turn 2.4s ease-in-out infinite}
}
@keyframes turn{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.rotate svg{animation:none;transform:rotate(-90deg)}}
.stage{position:relative;width:100%;height:calc(100vh - 24px);height:calc(100dvh - 24px);min-height:300px;border-radius:14px;overflow:hidden;background:var(--ink);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}
#cv{touch-action:none}
.hud{position:absolute;inset:10px 14px auto 14px;pointer-events:none;text-align:center;text-shadow:0 1px 10px rgba(11,10,20,.65)}
#hudDist{font-size:26px;font-weight:300;letter-spacing:.06em;line-height:1;font-variant-numeric:tabular-nums}
#hudSub{display:block;margin-top:5px;font-size:12px;letter-spacing:.14em;opacity:.8;font-variant-numeric:tabular-nums}
#hudOrbs{position:absolute;right:0;top:5px;font-size:14px;font-variant-numeric:tabular-nums}

#toast{display:block;margin:8px auto 0;max-width:80%;font-size:13px;letter-spacing:.06em;color:var(--fg);opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.on{animation:msg 2s ease both}
#toast.z{font-size:13px;font-weight:300;letter-spacing:.45em;text-transform:uppercase;padding-left:.45em}
#toast.ok{color:var(--ember)}
@keyframes msg{0%{opacity:0;transform:translateY(-3px)}14%{opacity:.95;transform:none}78%{opacity:.95}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#toast.on{animation:none;opacity:.95}}
#zone{position:absolute;left:0;right:0;top:25%;text-align:center;font-weight:300;font-size:clamp(22px,6vw,42px);letter-spacing:.5em;padding-left:.5em;
  text-transform:uppercase;pointer-events:none;opacity:0;text-shadow:0 0 20px rgba(11,10,20,.55)}
#zone.show{animation:zone 2.8s ease both}
@keyframes zone{0%{opacity:0;letter-spacing:.3em}18%{opacity:1}72%{opacity:1}100%{opacity:0;letter-spacing:.62em}}
.veil{position:absolute;inset:0;background:linear-gradient(rgba(11,10,20,.14),var(--veil) 55%);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:11px;padding:16px;text-align:center;overflow:auto}

.veil.shop{display:grid;grid-template-rows:30% minmax(0,1fr);grid-template-columns:minmax(0,1fr);align-items:stretch;justify-content:stretch;padding:0;gap:0;background:none;overflow:hidden}
.panel{grid-row:2;min-height:0;min-width:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 14px 0;
  background:linear-gradient(rgba(11,10,20,0),rgba(11,10,20,.86) 24px)}
@media (min-aspect-ratio:4/5){
  .veil.shop{grid-template-rows:minmax(0,1fr);grid-template-columns:40% minmax(0,1fr)}
  .panel{grid-row:1;grid-column:2;padding:12px 16px 0 36px;background:linear-gradient(90deg,rgba(11,10,20,0),rgba(11,10,20,.86) 30px)}
}
.tabs{display:flex;gap:4px;align-items:center;width:100%}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--ember)}
.wallet{margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
#secs{display:flex;flex-direction:column;gap:14px;width:100%}
.sec{display:flex;flex-direction:column;gap:5px;align-items:center;width:100%}
.bar{position:sticky;bottom:0;margin-top:auto;width:100%;display:flex;gap:9px;justify-content:center;padding:12px 0;min-height:12px;background:linear-gradient(rgba(11,10,20,0),rgba(11,10,20,.95) 45%)}
.veil h1{margin:0;font-weight:300;font-size:clamp(34px,9.5vw,70px);letter-spacing:.22em;text-transform:uppercase;line-height:1;padding-left:.22em}
.veil h2{margin:0;font-weight:300;font-size:clamp(34px,8vw,56px);letter-spacing:.04em;line-height:1;font-variant-numeric:tabular-nums}
.veil h3{margin:0;font-weight:400;font-size:22px;letter-spacing:.2em;text-transform:uppercase;line-height:1;padding-left:.2em}
.veil p{margin:0;color:var(--muted);max-width:42ch}
.label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.quiet{font-size:14px;color:var(--fg)!important}
.quiet::before{content:"○ ";color:var(--ember)}
.quiet:empty,.label:empty{display:none}
.row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,48px);gap:7px;justify-content:center;width:100%}
.it{position:relative;display:grid;place-items:center;width:48px;height:48px;border-radius:12px;border:2px solid var(--line);padding:0;overflow:hidden;background:linear-gradient(#4a3a7c,#ff9d78 78%,#ffd9a0)}
.it.col{background:rgba(11,10,20,.5)}
.it.dk{background:linear-gradient(#241f47,#5a3d78)}
.it[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--ember)}
.it.locked canvas,.it.locked .dot{opacity:.6}
.it .tag{position:absolute;inset:auto 0 0 0;background:rgba(11,10,20,.74);font-size:9px;line-height:1;padding:3px 0 1px;white-space:nowrap}
.dot{display:block;width:26px;height:26px;border-radius:50%;background:var(--c)}
.go:disabled{background:rgba(255,236,214,.16);color:var(--muted);cursor:default}
.go{background:var(--ember);color:#2a1400;border:0;border-radius:999px;padding:11px 28px 8px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px}
.ghost{background:rgba(11,10,20,.45);border:1px solid var(--line);border-radius:999px;padding:8px 16px 6px;font-size:13px}
.ghost:hover{border-color:var(--fg)}
.icon{background:none;border:0;padding:8px;line-height:0;color:var(--fg);opacity:.85;border-radius:50%}
.icon:hover{opacity:1}
.corner{position:absolute;top:6px;right:8px}
.corner{display:flex;gap:2px}
.menu{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.menu .row{flex-wrap:nowrap;gap:6px}
.menu .ghost{padding:8px 11px 6px;white-space:nowrap}
.go.big{padding:13px 44px 10px;font-size:15px}
.daily{align-items:center;text-align:center;gap:10px}
.daily .head{align-self:stretch}
.daily h2{margin:14px 0 2px}
#hudGoal{display:block;margin-top:5px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
#hudGoal:empty{display:none}

.veil.sheet{justify-content:flex-start;gap:0;padding:0;background:rgba(11,10,20,.72)}
.sheetIn{width:min(100%,400px);display:flex;flex-direction:column;gap:6px;padding:10px 14px 18px}
.head{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:6px;margin:-10px -14px 6px;padding:10px 14px 8px;background:linear-gradient(rgba(11,10,20,.96) 70%,rgba(11,10,20,0))}
.head h3{font-size:16px;padding:0;margin:0}
.head span{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.ms li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(255,236,214,.08);font-size:14px}
.ms li::before{content:"○";color:var(--muted)}
.ms li.done{color:var(--muted)}
.ms li.done::before{content:"✓";color:var(--ember)}
.ms li.now::before{content:"●";color:var(--ember)}
.ms li.later{opacity:.45}
.ms .rw{font-size:12px;color:var(--ember);white-space:nowrap}
.ms li.done .rw{color:var(--muted)}
.ms .pg{grid-column:2/4;height:3px;border-radius:2px;background:rgba(255,236,214,.14);overflow:hidden}
.ms .pg i{display:block;height:100%;background:var(--ember)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,236,214,.08);font-size:15px;text-align:left}
.opt input[type=range]{width:46%;accent-color:var(--ember)}
#pauseSnd{width:min(100%,280px);margin:2px 0 6px}

#pauseV{background:rgba(11,10,20,.72)}
.stage.paused #hud,.stage.paused #zone{visibility:hidden}
@media (max-height:440px){#pauseV{gap:8px}#pauseV h2{font-size:30px}#pauseSnd .opt{padding:6px 4px}}
#pauseSnd .opt{padding:9px 4px;font-size:14px}
#pauseSnd .opt:last-child{border-bottom:0}
.sw2{position:relative;width:42px;height:24px;border-radius:999px;border:0;padding:0;background:rgba(255,236,214,.18);flex:none}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg);transition:transform .15s}
.sw2[aria-checked="true"]{background:var(--ember)}
.sw2[aria-checked="true"]::after{transform:translateX(18px)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px 3px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ember);color:#2a1400}
.danger{margin-top:18px;align-self:center;background:none;border:1px solid rgba(255,140,122,.5);color:#ffb3a6;border-radius:999px;padding:8px 18px 6px;font-size:13px}
.ghost.fresh::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ember);margin-left:8px;vertical-align:middle}
#hudPow{display:block;width:90px;height:3px;margin:7px auto 0;border-radius:2px;background:rgba(255,236,214,.18);overflow:hidden}
#hudPow i{display:block;height:100%;background:#ff9a5a}
#hudPow[hidden]{display:none}
#btnPause{position:absolute;top:8px;left:10px;width:44px;height:44px;display:grid;place-items:center;padding:0;border-radius:50%;background:rgba(11,10,20,.4);border:1px solid rgba(255,236,214,.3);opacity:1}
#btnPause svg{width:22px;height:22px}
#hint{position:absolute;left:0;right:0;bottom:20%;text-align:center;font-size:14px;letter-spacing:.2em;text-transform:uppercase;pointer-events:none;text-shadow:0 1px 10px rgba(11,10,20,.7)}
</style>

<main id="app">
  <div class="rotate" role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>Gire o celular</div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Cena do jogo"></canvas>
    <div class="hud" id="hud" hidden><span id="hudDist"></span><span id="hudSub"></span><span id="hudOrbs"></span><span id="hudGoal"></span><span id="hudPow" hidden><i id="hudPowBar"></i></span><span id="toast" role="status" hidden></span></div>
    <button class="icon" id="btnPause" type="button" aria-label="Pausar" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
    <div id="zone" aria-hidden="true"></div>
    <div id="hint" hidden>Segure para subir</div>
    <div class="veil" id="home">
      <div class="corner">
        <button class="icon" id="btnSettings" type="button" aria-label="Ajustes"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
      <h1>Planador</h1>
      <div class="menu">
        <button class="go big" id="btnFly" type="button">Voar</button>
        <div class="row"><button class="ghost" id="btnDaily" type="button">Desafio do dia</button><button class="ghost" id="btnMissions" type="button">Missões</button><button class="ghost" id="btnPick" type="button">Personalizar</button></div>
      </div>
      <p class="quiet" id="missions"></p>
      <span class="label" id="bestLine"></span>
    </div>
    <div class="veil shop" id="pick" hidden>
      <div class="panel" id="panel">
        <div class="tabs" role="tablist" aria-label="O que personalizar">
          <button class="icon" id="btnClose" type="button" aria-label="Voltar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
          <button class="tab" id="tabPilot" type="button" role="tab">Piloto</button>
          <button class="tab" id="tabGlider" type="button" role="tab">Planador</button>
          <span class="wallet" id="wallet"></span>
        </div>
        <h3 id="pickName"></h3>
        <div id="secs"></div>
        <div class="bar"><button class="go" id="btnDone" type="button" hidden></button></div>
      </div>
    </div>
    <div class="veil sheet" id="msSheet" hidden>
      <div class="sheetIn">
        <div class="head"><button class="icon" type="button" data-close aria-label="Voltar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button><h3>Missões</h3><span id="msCount"></span></div>
        <ul class="ms" id="msList"></ul>
      </div>
    </div>
    <div class="veil sheet" id="daySheet" hidden>
      <div class="sheetIn daily">
        <div class="head"><button class="icon" type="button" data-close aria-label="Voltar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button><h3>Desafio do dia</h3><span id="dayDate"></span></div>
        <span class="label">Meta</span>
        <h2 id="dayGoal"></h2>
        <span class="label" id="dayInfo"></span>
        <button class="go big" id="btnDayFly" type="button">Voar</button>
      </div>
    </div>
    <div class="veil sheet" id="setSheet" hidden>
      <div class="sheetIn">
        <div class="head"><button class="icon" type="button" data-close aria-label="Voltar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button><h3>Ajustes</h3></div>
        <div class="opt">Efeitos sonoros<button class="sw2" type="button" role="switch" data-opt="sfx" aria-label="Efeitos sonoros"></button></div>
        <div class="opt">Vento<button class="sw2" type="button" role="switch" data-opt="wind" aria-label="Vento"></button></div>
        <label class="opt">Volume<input type="range" class="volIn" id="vol" min="0" max="100" step="5"></label>
        <div class="opt" id="optVibe">Vibrar ao bater<button class="sw2" type="button" role="switch" data-opt="vibe" aria-label="Vibrar ao bater"></button></div>
        <div class="opt">Tremer a tela<button class="sw2" type="button" role="switch" data-opt="shake" aria-label="Tremer a tela"></button></div>
        <div class="opt">Gráficos<span class="seg" role="group" aria-label="Gráficos"><button type="button" data-q="0">Bonito</button><button type="button" data-q="1">Leve</button></span></div>
        <button class="danger" id="btnReset" type="button">Apagar progresso</button>
      </div>
    </div>
    <div class="veil" id="pauseV" hidden>
      <h2>Pausado</h2>
      <div id="pauseSnd">
        <div class="opt">Efeitos sonoros<button class="sw2" type="button" role="switch" data-opt="sfx" aria-label="Efeitos sonoros"></button></div>
        <div class="opt">Vento<button class="sw2" type="button" role="switch" data-opt="wind" aria-label="Vento"></button></div>
        <label class="opt">Volume<input type="range" class="volIn" min="0" max="100" step="5"></label>
      </div>
      <div class="row"><button class="go" id="btnResume" type="button">Continuar</button><button class="ghost" id="btnQuit" type="button">Início</button></div>
    </div>
    <div class="veil" id="over" hidden>
      <h2 id="overDist"></h2>
      <span class="label" id="overInfo"></span>
      <p class="quiet" id="overMissions"></p>
      <div class="row"><button class="go" id="btnAgain" type="button">Voar</button><button class="ghost" id="btnHome" type="button">Início</button></div>
    </div>
